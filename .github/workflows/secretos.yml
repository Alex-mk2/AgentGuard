name: Secretos

# Respaldo del hook de pre-commit: escanea todo el historial en cada PR.
# El repo es público desde el 2026-11-25 y tiene el escaneo de secretos y la push protection de
# GitHub; este job sigue como segunda capa con las mismas reglas que el hook (gitleaks).
# Solo en PR: `main` exige la rama al día y no admite push directo, así que el PR ya probó el mismo
# código que queda en `main`; repetirlo tras el merge solo gastaba minutos de Actions.
on:
  pull_request:
    branches: [main]

# Un commit nuevo en el mismo PR cancela la corrida anterior, que ya no sirve.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read   # SPEC-0039 E16

jobs:
  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0   # historial completo: un secreto borrado sigue en commits viejos

      - name: Escanear con gitleaks
        # Imagen oficial con versión fijada (misma que .pre-commit-config.yaml).
        run: |
          docker run --rm -v "$GITHUB_WORKSPACE:/repo" \
            zricethezav/gitleaks:v8.30.1 git /repo --redact --verbose
