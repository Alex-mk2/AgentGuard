name: Secretos

# Respaldo del hook de pre-commit: escanea todo el historial en cada PR y push a main.
# Repo privado sin push protection de GitHub, así que este es el control del lado servidor.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read   # SPEC-0039 E16

jobs:
  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0   # historial completo: un secreto borrado sigue en commits viejos

      - name: Escanear con gitleaks
        # Imagen oficial con versión fijada (misma que .pre-commit-config.yaml).
        run: |
          docker run --rm -v "$GITHUB_WORKSPACE:/repo" \
            zricethezav/gitleaks:v8.30.1 git /repo --redact --verbose
