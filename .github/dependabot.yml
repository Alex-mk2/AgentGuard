# Actualizaciones semanales, agrupadas por ecosistema para no llenar la lista de PRs.
# Cada PR pasa por las 5 capas del CI (audits incluidos) y lo revisa Alex, como cualquier otro.
# Las versiones mayores de pip y el salto de versión de Python se hacen a mano, con prueba real.
version: 2
updates:
  - package-ecosystem: pip
    directory: /backend
    schedule: { interval: weekly, day: monday }
    open-pull-requests-limit: 5
    groups:
      python-menores:
        update-types: [minor, patch]
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: npm
    directory: /frontend
    schedule: { interval: weekly, day: monday }
    open-pull-requests-limit: 5
    groups:
      npm-menores:
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: weekly, day: monday }
    open-pull-requests-limit: 5
    groups:
      acciones:
        patterns: ["*"]

  - package-ecosystem: docker
    directory: /
    schedule: { interval: weekly, day: monday }
    open-pull-requests-limit: 5
    ignore:
      # El stack fija Debian 13 (de ahí sale Python 3.13) y Node 24. La base distroless va fijada
      # por digest: Dependabot propone el digest nuevo. Saltar a Debian 14 se hace a mano y junto
      # con la distroless (mismo paquete de Python en las dos etapas).
      - dependency-name: debian
        update-types: ["version-update:semver-major"]
      - dependency-name: node
        update-types: ["version-update:semver-major"]
