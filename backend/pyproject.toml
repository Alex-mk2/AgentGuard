# Configuración de herramientas de calidad. Las dependencias siguen en requirements*.txt;
# pytest se configura en pytest.ini.

[project]
name = "agentguard"
version = "0.1.0"
requires-python = ">=3.13"

[tool.ruff]
target-version = "py313"
line-length = 100

[tool.ruff.lint]
# E/F/W: errores base · I: orden de imports · B: bugs comunes · UP: sintaxis 3.13
# ASYNC: bloqueos dentro de async · RUF: reglas propias de ruff
select = ["E", "F", "W", "I", "B", "UP", "ASYNC", "RUF"]

[tool.mypy]
python_version = "3.13"
strict = true
plugins = ["pydantic.mypy"]
files = ["app", "tests"]

[[tool.mypy.overrides]]
# asyncpg no trae tipos; se evita sumar asyncpg-stubs como dependencia.
module = ["asyncpg", "asyncpg.*"]
ignore_missing_imports = true

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true
warn_required_dynamic_aliases = true

[tool.bandit]
# B101 (assert): los assert solo acotan tipos para mypy y la imagen nunca corre con `python -O`.
# Cualquier otro hallazgo hace fallar el CI; un `# nosec` lleva la regla y el motivo.
exclude_dirs = ["tests", ".venv"]
skips = ["B101"]
