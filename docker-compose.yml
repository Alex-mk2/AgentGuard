# Entorno local (SPEC-0001 H1): `docker compose up --build` y abrir http://localhost:8000
# Credenciales solo de desarrollo; los puertos se publican solo en 127.0.0.1.
# Postgres usa 5434 en el equipo: 5432 suele ser un PostgreSQL instalado y 5433 el de CondorForge.
services:
  db:
    image: postgres:16.16
    environment:
      POSTGRES_USER: agentguard
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-agentguard}
      POSTGRES_DB: agentguard
    ports: ["127.0.0.1:${POSTGRES_PUERTO:-5434}:5432"]
    volumes: [datos:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U agentguard -d agentguard"]
      interval: 5s
      retries: 12

  app:
    build: .
    environment:
      DATABASE_URL: postgresql://agentguard:${POSTGRES_PASSWORD:-agentguard}@db:5432/agentguard
      # Secret Broker (SPEC-0003): descomentar y montar el archivo. Secretos y tokens van en el .env:
      # AGENTGUARD_SECRETO_<NOMBRE>, AGENTGUARD_AGENTE_<ID> y AGENTGUARD_ADMIN_TOKEN.
      # SECRETOS_CONFIG: /srv/config/acciones.json
    env_file:
      - path: .env
        required: false
    # volumes: ["./config/acciones.json:/srv/config/acciones.json:ro"]
    ports: ["127.0.0.1:${APP_PUERTO:-8000}:8000"]  # APP_PUERTO si el 8000 está ocupado
    # Endurecimiento (SPEC-0003 E17): solo lectura, sin capabilities y sin ganar privilegios.
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    depends_on:
      db:
        condition: service_healthy

volumes:
  datos:
